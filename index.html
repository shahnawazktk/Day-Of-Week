<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Of week by ShanII</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Today's Date Information</h1>
        </header>
        
        <main>
            <div class="date-card">
                <div class="icon">
                    <i class="fas fa-calendar-day"></i>
                </div>
                <div class="info">
                    <h2>Day of the Week</h2>
                    <p id="dayOfWeek">Loading...</p>
                </div>
            </div>
            
            <div class="date-card">
                <div class="icon">
                    <i class="fas fa-calendar-alt"></i>
                </div>
                <div class="info">
                    <h2>Month of the Year</h2>
                    <p id="monthOfYear">Loading...</p>
                </div>
            </div>
            
            <div class="date-card full-date">
                <div class="icon">
                    <i class="fas fa-clock"></i>
                </div>
                <div class="info">
                    <h2>Full Date</h2>
                    <p id="fullDate">Loading...</p>
                </div>
            </div>
        </main>
        
        <footer>
            <p>© <span id="currentYear"></span> Date Information Project</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
